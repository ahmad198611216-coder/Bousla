<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123a5a">
<title>بوصلة اليوم · Bousla Today</title>
<script>
// Pick language before paint: ?lang=en|ar, then the saved choice, else Arabic.
(function(){
  var l = "ar";
  try {
    var q = new URLSearchParams(location.search).get("lang");
    var s = localStorage.getItem("bousla_lang");
    l = (q === "en" || q === "ar") ? q : (s === "en" || s === "ar") ? s : "ar";
  } catch (e) {}
  window.LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === "en" ? "ltr" : "rtl";
  document.title = l === "en" ? "Bousla Today" : "بوصلة اليوم";
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: app-like single column — header (brand, language switch, streak), five tabs, one card stack per tab */
:root{
  --bg:#F7F5F0; --card:#ffffff; --fg:#182338; --muted:#5b6577; --line:rgba(14,27,58,.12);
  --navy:#0E1B3A; --accent:#E0A32E; --accent-ink:#241802; --good:#178b84; --bad:#7A1F3D; --soft:#efece3; --gold:#f6e3b4;
  --font:"IBM Plex Sans Arabic","Readex Pro",system-ui,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[lang="en"]{--font:"Readex Pro","IBM Plex Sans Arabic",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1430; --card:#121f42; --fg:#eef1f7; --muted:#a3adc2; --line:rgba(255,255,255,.12);
  --navy:#16264d; --accent:#E0A32E; --accent-ink:#241802; --good:#3fc7be; --bad:#e37a9a; --soft:#1a2a52; --gold:#3a2f14; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.7;padding-block:0 40px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:#fff;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px;flex:none}
.brand h1{margin:0;font-size:1.35rem;font-weight:800;line-height:1.2}
.brand p{margin:0;font-size:.85rem;opacity:.8}
.tools{display:flex;gap:8px;align-items:center}
.home{color:#fff;text-decoration:none;font-weight:700;font-size:.85rem;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 12px}
.lang{font:inherit;font-weight:800;font-size:.85rem;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.streak{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;border:0;font:inherit;font-weight:800;cursor:pointer}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
nav button{font:inherit;font-weight:700;font-size:.8rem;border:0;border-radius:12px;padding:9px 4px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;line-height:1.3}
nav button[aria-selected="true"]{background:#fff;color:var(--navy)}
nav button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-inline-start:5px;vertical-align:middle}
main{margin-top:18px;display:grid;gap:16px}
section[role=tabpanel]{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:grid;gap:12px;min-width:0}
.eyebrow{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:0}
h1,h2{font-family:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif}
h2{margin:0;font-size:1.5rem;line-height:1.3;text-wrap:balance}
h3{margin:0;font-size:1.05rem}
.tag{display:inline-block;background:var(--soft);color:var(--fg);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;min-width:0}
.box ul{margin:4px 0 0;padding-inline-start:18px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:start;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:11px 14px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt.right{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.note{margin:0;font-weight:700}
.note.good{color:var(--good)} .note.bad{color:var(--bad)}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;background:var(--navy);color:#fff;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--fg)}
.btn[disabled]{opacity:.6;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.clues{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.clues li{background:var(--soft);border-radius:12px;padding:10px 14px}
.score{font-variant-numeric:tabular-nums;font-weight:800}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{font:inherit;font-size:.82rem;line-height:1.3;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 2px;cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.q{display:grid;gap:8px}
.q p{margin:0;font-weight:700}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:9em 1fr 2.5em;gap:10px;align-items:center;font-size:.92rem}
.track{height:12px;border-radius:999px;background:var(--soft);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.num{font-variant-numeric:tabular-nums;text-align:end;color:var(--muted)}
.muted{color:var(--muted);margin:0;font-size:.92rem}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* snake */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.lvl{font:inherit;text-align:start;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:10px 12px;cursor:pointer;display:grid;gap:2px;min-width:0}
.lvl b{font-size:.8rem;color:var(--muted)}
.lvl span{font-weight:700;line-height:1.35}
.lvl i{font-style:normal;font-size:.9rem;letter-spacing:2px}
.lvl[disabled]{opacity:.55;cursor:not-allowed}
.lvl.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.hud .goal{background:var(--soft);border-radius:999px;padding:3px 12px;font-size:.92rem}
.board{width:100%;max-width:480px;margin:0 auto;aspect-ratio:1;display:block;border-radius:14px;background:#0e2233;touch-action:none}
.ticker{min-height:1.7em;margin:0;text-align:center;font-weight:700;color:var(--good)}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center;direction:ltr}
.pad button{font:inherit;font-size:1.4rem;border:0;border-radius:14px;background:var(--soft);color:var(--fg);cursor:pointer;touch-action:manipulation}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.stars-big{font-size:2rem;letter-spacing:6px;margin:0;text-align:center}
/* champions */
.prize{background:var(--gold);border-radius:18px;padding:18px;display:grid;gap:6px}
.prize h2{font-size:1.25rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:10px;text-align:center;min-width:0}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:700}
.badge.off{opacity:.45}
.board-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board-list li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
.board-list li.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.board-list .r{font-weight:800;text-align:center}
.board-list .nm{font-weight:700;overflow-wrap:anywhere;min-width:0}
.nick{display:flex;gap:8px;flex-wrap:wrap}
.nick input{flex:1 1 180px;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#E0A32E" stroke-width="2"/><path d="M20 6 L24 20 L20 34 L16 20 Z" fill="#E0A32E"/><path d="M20 6 L16 20 L20 20 Z" fill="#fff"/><circle cx="20" cy="20" r="2.4" fill="#fff"/></svg>
        <div>
          <h1 data-i="brand"></h1>
          <p id="today"></p>
        </div>
      </div>
      <div class="tools">
        <a class="home" id="home" href="/"></a>
        <button class="lang" id="lang" type="button"></button>
        <button class="streak" id="streak" type="button"></button>
      </div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" id="t-major" aria-controls="p-major" aria-selected="true"><span data-i="tabMajor"></span><span class="dot" id="d-major"></span></button>
      <button role="tab" id="t-game" aria-controls="p-game" aria-selected="false"><span data-i="tabGame"></span><span class="dot" id="d-game"></span></button>
      <button role="tab" id="t-self" aria-controls="p-self" aria-selected="false"><span data-i="tabSelf"></span><span class="dot" id="d-self"></span></button>
      <button role="tab" id="t-snake" aria-controls="p-snake" aria-selected="false"><span data-i="tabSnake"></span><span class="dot" id="d-snake"></span></button>
      <button role="tab" id="t-champ" aria-controls="p-champ" aria-selected="false"><span data-i="tabChamp"></span></button>
    </nav>
  </div>
</header>

<div class="wrap">
<main>
  <section id="p-major" role="tabpanel" aria-labelledby="t-major">
    <div class="card">
      <p class="eyebrow" data-i="tabMajor"></p>
      <div class="row"><h2 id="m-name"></h2><span class="tag" id="m-area"></span></div>
      <p id="m-desc" style="margin:0"></p>
      <div class="grid3">
        <div class="box"><h3 data-i="study"></h3><ul id="m-study"></ul></div>
        <div class="box"><h3 data-i="work"></h3><ul id="m-jobs"></ul></div>
        <div class="box"><h3 data-i="skills"></h3><ul id="m-skills"></ul></div>
      </div>
    </div>
    <div class="card">
      <p class="eyebrow" data-i="quick"></p>
      <h3 id="mq-text"></h3>
      <div class="opts" id="mq-opts"></div>
      <p class="note" id="mq-note" role="status"></p>
    </div>
  </section>

  <section id="p-game" role="tabpanel" aria-labelledby="t-game" hidden>
    <div class="card" id="g-card">
      <div class="row"><p class="eyebrow" id="g-round"></p><span class="score" id="g-score"></span></div>
      <h2 data-i="gTitle"></h2>
      <p class="muted" data-i="gHelp"></p>
      <ul class="clues" id="g-clues"></ul>
      <div class="opts" id="g-opts"></div>
      <p class="note" id="g-note" role="status"></p>
      <div class="row">
        <button class="btn alt" id="g-hint" type="button" data-i="gHint"></button>
        <button class="btn" id="g-next" type="button" hidden></button>
      </div>
    </div>
    <div class="card" id="g-end" hidden>
      <p class="eyebrow" data-i="gOver"></p>
      <h2 id="g-final"></h2>
      <p class="muted" id="g-best"></p>
      <p class="muted" data-i="gTomorrow"></p>
      <button class="btn alt" id="g-again" type="button" data-i="gAgain"></button>
    </div>
  </section>

  <section id="p-self" role="tabpanel" aria-labelledby="t-self" hidden>
    <div class="card">
      <p class="eyebrow" data-i="sEyebrow"></p>
      <h2 data-i="sTitle"></h2>
      <div id="s-qs" style="display:grid;gap:16px"></div>
      <button class="btn" id="s-save" type="button" data-i="sSave"></button>
      <p class="note" id="s-note" role="status"></p>
    </div>
    <div class="card">
      <div class="row"><p class="eyebrow" data-i="sBars"></p><span class="muted" id="s-count"></span></div>
      <div class="bars" id="s-bars"></div>
      <p class="muted" data-i="sNote"></p>
    </div>
  </section>

  <section id="p-snake" role="tabpanel" aria-labelledby="t-snake" hidden>
    <div class="card" id="sn-map">
      <p class="eyebrow" data-i="snEyebrow"></p>
      <h2 data-i="tabSnake"></h2>
      <p class="muted" data-i="snHelp"></p>
      <div class="levels" id="sn-levels"></div>
    </div>
    <div class="card" id="sn-play" hidden>
      <div class="hud"><span id="sn-title"></span><span id="sn-lives"></span></div>
      <div class="hud"><span class="goal" id="sn-goal"></span><span class="score" id="sn-prog"></span></div>
      <canvas class="board" id="sn-canvas"></canvas>
      <p class="ticker" id="sn-ticker" role="status"></p>
      <div class="pad">
        <button class="up" type="button" data-d="up">▲</button>
        <button class="left" type="button" data-d="left">◀</button>
        <button class="down" type="button" data-d="down">▼</button>
        <button class="right" type="button" data-d="right">▶</button>
      </div>
      <div class="row">
        <button class="btn alt" id="sn-pause" type="button"></button>
        <button class="btn alt" id="sn-exit" type="button" data-i="snLevels"></button>
      </div>
    </div>
    <div class="card" id="sn-result" hidden>
      <p class="eyebrow" id="sn-r-eyebrow"></p>
      <h2 id="sn-r-title"></h2>
      <p class="stars-big" id="sn-r-stars"></p>
      <div class="box" id="sn-r-box"><h3 data-i="snLearned"></h3><ul id="sn-r-list"></ul></div>
      <div class="row">
        <button class="btn" id="sn-r-next" type="button" data-i="snNext"></button>
        <button class="btn alt" id="sn-r-retry" type="button" data-i="snRetry"></button>
        <button class="btn alt" id="sn-r-map" type="button" data-i="snLevels"></button>
      </div>
    </div>
  </section>

  <section id="p-champ" role="tabpanel" aria-labelledby="t-champ" hidden>
    <div class="prize">
      <p class="eyebrow" id="c-month"></p>
      <h2 data-i="cPrizeTitle"></h2>
      <p style="margin:0" id="c-prize"></p>
      <p class="muted" id="c-left"></p>
    </div>
    <div class="card">
      <p class="eyebrow" data-i="cMine"></p>
      <div class="stats">
        <div class="stat"><b id="c-mdays">–</b><span data-i="cMonthDays"></span></div>
        <div class="stat"><b id="c-streak">–</b><span data-i="cStreak"></span></div>
        <div class="stat"><b id="c-rank">–</b><span data-i="cRank"></span></div>
      </div>
      <div class="badges" id="c-badges"></div>
      <p class="muted" id="c-status" role="status"></p>
    </div>
    <div class="card">
      <h3 data-i="cNickTitle"></h3>
      <p class="muted" data-i="cNickHelp"></p>
      <form class="nick" id="c-form" novalidate>
        <input id="c-nick" type="text" maxlength="20" autocomplete="nickname">
        <button class="btn" id="c-save" type="submit" data-i="cNickSave"></button>
      </form>
      <p class="note" id="c-nnote" role="status"></p>
    </div>
    <div class="card">
      <div class="row"><h3 data-i="cTop"></h3><button class="btn alt" id="c-refresh" type="button" data-i="cRefresh"></button></div>
      <ol class="board-list" id="c-list"></ol>
      <p class="muted" id="c-empty" hidden data-i="cEmpty"></p>
    </div>
  </section>
</main>
</div>

<script>

// ---------- streak ----------
let serverStreak = null;
function markActive(kind){
  const done = store.get("done_"+DAY, {});
  done[kind] = true; store.set("done_"+DAY, done);
  const last = store.get("lastDay", null);
  let streak = store.get("streak", 0);
  if (last !== DAY){ streak = (last === DAY-1) ? streak + 1 : 1; store.set("streak", streak); store.set("lastDay", DAY); }
  renderStreak(); renderDots();
}
function renderStreak(){
  const last = store.get("lastDay", null);
  let s = store.get("streak", 0);
  if (last !== DAY && last !== DAY-1) s = 0;
  if (serverStreak !== null) s = Math.max(s, serverStreak);
  $("streak").textContent = "🔥 " + s + days(s);
  $("streak").setAttribute("aria-label", t("أيام متتالية: ","Days in a row: ") + s);
}
function renderDots(){
  const done = store.get("done_"+DAY, {});

}

// ---------- guess the major ----------
const game = { rounds:[], i:0, clue:1, score:0, over:false };
function startGame(practice){
  const r = rng(DAY*13 + (practice ? Date.now() % 1000 : 0));
  game.rounds = shuffle(MAJORS, r).slice(0,5).map(m => {
    const wrong = shuffle(MAJORS.filter(x => x.n !== m.n), r).slice(0,3).map(x => x.n);
    return { m, opts: shuffle([m.n, ...wrong], r) };
  });
  game.i = 0; game.score = 0; game.practice = !!practice;
  $("g-card").hidden = false; $("g-end").hidden = true;
  renderRound();
}
function renderRound(){
  const { opts } = game.rounds[game.i];
  game.clue = 1; game.over = false;
  $("g-round").textContent = t("الجولة " + (game.i+1) + " من 5", "Round " + (game.i+1) + " of 5");
  $("g-score").textContent = t("النقاط: ","Points: ") + game.score;
  $("g-note").textContent = ""; $("g-note").className = "note";
  $("g-next").hidden = true; $("g-hint").hidden = false; $("g-hint").disabled = false;
  renderClues();
  const box = $("g-opts"); box.replaceChildren();
  opts.forEach(o => { const b = el("button","opt",o); b.type="button"; b.addEventListener("click", () => answer(o)); box.append(b); });
}
function renderClues(){
  const m = game.rounds[game.i].m;
  const all = LANG === "en"
    ? ["You'll study: " + m.s[0] + " and " + m.s[1], "It needs: " + m.k.join(", "), "You might work: " + m.c[0]]
    : ["ستدرس فيه: " + m.s[0] + "، و" + m.s[1], "يحتاج إلى: " + m.k.join("، "), "قد تعمل: " + m.c[0]];
  $("g-clues").replaceChildren(...li(all.slice(0, game.clue)));
  if (game.clue >= 3) $("g-hint").disabled = true;
}
$("g-hint").addEventListener("click", () => { if (game.clue < 3){ game.clue++; renderClues(); } });
function answer(o){
  if (game.over) return; game.over = true;
  const right = game.rounds[game.i].m.n;
  const pts = o === right ? 4 - game.clue : 0;
  game.score += pts;
  [...$("g-opts").children].forEach(b => { b.disabled = true; if (b.textContent === right) b.classList.add("right"); else if (b.textContent === o) b.classList.add("wrong"); });
  $("g-note").className = "note " + (pts ? "good":"bad");
  $("g-note").textContent = pts ? t("أحسنت! +" + pts + " نقاط", "Well done! +" + pts + " points") : t("الإجابة: ","The answer: ") + right;
  $("g-score").textContent = t("النقاط: ","Points: ") + game.score;
  game.clue = 3; renderClues();
  $("g-hint").hidden = true; $("g-next").hidden = false;
  $("g-next").textContent = game.i < 4 ? t("التالي","Next") : t("النتيجة","See result");
}
$("g-next").addEventListener("click", () => { if (game.i < 4){ game.i++; renderRound(); } else endGame(); });
function scoreLine(prefixAr, prefixEn, s){ return t(prefixAr + s + " من 15", prefixEn + s + " / 15"); }
function endGame(){
  $("g-card").hidden = true; $("g-end").hidden = false;
  $("g-final").textContent = scoreLine("نتيجتك: ","Your score: ", game.score);
  if (!game.practice){
    store.set("game_"+DAY, game.score);
    store.set("best", Math.max(store.get("best", 0), game.score));
    markActive("game");
  }
  $("g-best").textContent = scoreLine("أفضل نتيجة لك حتى الآن: ","Your best so far: ", store.get("best", game.score));
}
$("g-again").addEventListener("click", () => startGame(true));
if (store.get("game_"+DAY, null) !== null){
  game.score = store.get("game_"+DAY, 0); game.practice = true;
  $("g-card").hidden = true; $("g-end").hidden = false;
  $("g-final").textContent = scoreLine("نتيجتك اليوم: ","Today's score: ", game.score);
  $("g-best").textContent = scoreLine("أفضل نتيجة لك حتى الآن: ","Your best so far: ", store.get("best", game.score));
} else startGame(false);

    store.set("self_"+DAY, picks);

    qs.forEach((q, qi) => { tally[q.a] = (tally[q.a]||0) + picks[qi]; cnt[q.a] = (cnt[q.a]||0) + 1; });

    $("s-save").hidden = true; wrap.querySelectorAll("button").forEach(b => b.disabled = true);
    $("s-note").className = "note good"; $("s-note").textContent = t("حُفظت! أسئلة جديدة غدًا.","Saved! New questions tomorrow.");
    renderBars(); markActive("self");
  });
  function renderBars(){
    const tally = store.get("tally", {}), cnt = store.get("tallyN", {});
    const total = Object.values(cnt).reduce((a,b)=>a+b,0);
    $("s-count").textContent = total ? t("أجبت عن " + total + " سؤالًا", total + " questions answered") : "";
    const rows = areaKeys.map(a => ({a, pct: cnt[a] ? Math.round(tally[a] / (cnt[a]*4) * 100) : 0, n: cnt[a]||0})).sort((x,y) => y.pct - x.pct);

      line.append(el("span","num", row.n ? row.pct + "%" : "—"));

    }));

// ---------- snake: compass path ----------
(function(){
  const ICON = {health:"🩺", eng:"⚙️", biz:"📊", human:"🤝", art:"🎨", sci:"🔬"};
  const LEVEL_IDX = [0,10,13,18,23,24,2,6,14,17,22,26];
  const LEVELS = LEVEL_IDX.map((mi, i) => ({ m: MAJORS[mi], target: 5 + Math.ceil((i+1)/2), speed: Math.max(85, 175 - i*8), traps: i < 3 ? 1 : i < 7 ? 2 : 3 }));
  const N = 15;
  const cv = $("sn-canvas"), ctx = cv.getContext("2d");
  let st = null, timer = null, paused = false;
  const lvlName = i => t("المرحلة ","Level ") + (i+1);
  const pauseLabel = () => { $("sn-pause").textContent = paused ? t("متابعة","Resume") : t("إيقاف مؤقت","Pause"); };
  [["up","أعلى","Up"],["down","أسفل","Down"],["left","يسار","Left"],["right","يمين","Right"]].forEach(([d,a,e]) => document.querySelector('.pad [data-d="'+d+'"]').setAttribute("aria-label", t(a,e)));

  function walls(lv){
    const w = new Set(), add = (x,y) => w.add(x+","+y);
    if (lv >= 2) for (let i=0;i<N;i++){ add(i,0); add(i,N-1); add(0,i); add(N-1,i); }
    if (lv >= 4) for (let x=3;x<=11;x++){ if (x!==7){ add(x,4); add(x,10); } }
    if (lv >= 7){ for (let y=1;y<=3;y++){ add(7,y); add(7,N-1-y); } }
    if (lv >= 9){ [[4,2],[10,12],[2,2],[12,12],[2,12],[12,2]].forEach(([x,y]) => add(x,y)); }
    return w;
  }
  function stars(){ return store.get("snake_stars", []); }
  function unlocked(){ const s = stars(); let u = 0; while (u < LEVELS.length && s[u]) u++; return Math.min(u, LEVELS.length-1); }
  function renderMap(){
    const s = stars(), u = unlocked();
    $("sn-levels").replaceChildren(...LEVELS.map((L, i) => {
      const b = el("button","lvl"); b.type = "button";
      b.append(el("b", null, lvlName(i) + " " + ICON[L.m.a]), el("span", null, L.m.n),
        el("i", null, s[i] ? "★".repeat(s[i]) + "☆".repeat(3-s[i]) : (i <= u ? t("ابدأ","Start") : "🔒")));
      if (i > u) b.disabled = true;
      if (i === u && !s[i]) b.classList.add("next");
      b.addEventListener("click", () => start(i));
      return b;
    }));
    $("sn-map").hidden = false; $("sn-play").hidden = true; $("sn-result").hidden = true;
  }
  function freeCell(){
    for (let k=0;k<500;k++){
      const x = Math.floor(Math.random()*N), y = Math.floor(Math.random()*N);
      if (st.walls.has(x+","+y) || st.snake.some(p => p.x===x && p.y===y) || st.items.some(p => p.x===x && p.y===y)) continue;
      if (Math.abs(x - st.snake[0].x) + Math.abs(y - st.snake[0].y) < 2) continue;
      return {x, y};
    }
    return {x:1, y:1};
  }
  function spawn(){
    const L = LEVELS[st.li], others = Object.keys(ICON).filter(a => a !== L.m.a);
    st.items = [];
    st.items.push(Object.assign(freeCell(), {good:true, a:L.m.a}));
    for (let i=0;i<L.traps;i++) st.items.push(Object.assign(freeCell(), {good:false, a:others[Math.floor(Math.random()*others.length)]}));
  }
  function resetSnake(){ st.snake = [{x:6,y:7},{x:5,y:7},{x:4,y:7}]; st.dir = {x:1,y:0}; st.queue = []; }
  function start(lv){
    stop();
    const L = LEVELS[lv];
    st = { li: lv, walls: walls(lv), lives: 3, got: 0, items: [], learned: [] };
    resetSnake(); spawn();
    $("sn-title").textContent = lvlName(lv) + ": " + L.m.n;
    $("sn-goal").textContent = t("اجمع " + ICON[L.m.a] + " " + AREAS[L.m.a] + " فقط", "Collect only " + ICON[L.m.a] + " " + AREAS[L.m.a]);
    $("sn-ticker").style.color = "";
    $("sn-ticker").textContent = t("استعد… اسحب على اللوحة أو استخدم الأزرار.","Get ready… swipe on the board or use the buttons.");
    $("sn-map").hidden = true; $("sn-result").hidden = true; $("sn-play").hidden = false;
    paused = false; pauseLabel();
    hud(); size(); draw();
    const me = st; setTimeout(() => { if (st === me && !paused && !$("sn-play").hidden && !timer) run(); }, 1200);
  }
  function hud(){
    $("sn-lives").textContent = "❤️".repeat(st.lives) + "🤍".repeat(3 - st.lives);
    $("sn-prog").textContent = st.got + " / " + LEVELS[st.li].target;
  }
  function run(){ stop(); timer = setInterval(tick, LEVELS[st.li].speed); }
  function stop(){ if (timer){ clearInterval(timer); timer = null; } }
  window.snakePause = () => { if (timer){ stop(); paused = true; pauseLabel(); } };
  function tick(){
    if (st.queue.length) st.dir = st.queue.shift();
    let x = st.snake[0].x + st.dir.x, y = st.snake[0].y + st.dir.y;
    if (st.li < 2){ x = (x+N)%N; y = (y+N)%N; }
    const hitWall = x < 0 || y < 0 || x >= N || y >= N || st.walls.has(x+","+y);
    const hitSelf = st.snake.slice(0, -1).some(p => p.x===x && p.y===y);
    if (hitWall || hitSelf) return hurt(hitWall ? t("اصطدمت بجدار!","You hit a wall!") : t("اصطدمت بنفسك!","You ran into yourself!"));
    st.snake.unshift({x,y});
    const idx = st.items.findIndex(p => p.x===x && p.y===y);
    if (idx >= 0){
      const it = st.items[idx];
      if (it.good){
        st.got++;
        const m = LEVELS[st.li].m;
        const facts = [...m.s.map(v => t("ستدرس: ","You'll study: ") + v), ...m.k.map(v => t("مهارة: ","Skill: ") + v), ...m.c.map(v => t("تعمل في: ","Work in: ") + v)];
        const f = facts[(st.got-1) % facts.length]; st.learned.push(f);
        $("sn-ticker").style.color = ""; $("sn-ticker").textContent = "✓ " + f;
        hud();
        if (st.got >= LEVELS[st.li].target) return win();
        spawn();
      } else {
        st.snake.pop();
        return hurt(t("هذا رمز " + AREAS[it.a] + "، ليس من مجال " + LEVELS[st.li].m.n + ".", "That's a " + AREAS[it.a] + " symbol, not part of " + LEVELS[st.li].m.n + "."));
      }
    } else st.snake.pop();
    draw();
  }
  function hurt(msg){
    stop(); st.lives--; hud();
    $("sn-ticker").style.color = "var(--bad)"; $("sn-ticker").textContent = "✗ " + msg;
    draw(true);
    if (st.lives <= 0) return setTimeout(lose, 700);
    setTimeout(() => { resetSnake(); spawn(); draw(); if (!paused && !$("sn-play").hidden) run(); }, 900);
  }
  function win(){
    stop(); draw();
    const s = stars(); s[st.li] = Math.max(s[st.li] || 0, st.lives); store.set("snake_stars", s);
    markActive("snake");
    const last = st.li >= LEVELS.length - 1;
    $("sn-r-eyebrow").textContent = t("اكتملت ","") + lvlName(st.li) + t(""," complete");
    $("sn-r-title").textContent = last ? t("أنهيت مسار البوصلة كاملًا! 🎉","You finished the whole Compass Path! 🎉") : t("وصلت إلى تخصص ","You reached ") + LEVELS[st.li].m.n;
    $("sn-r-stars").textContent = "★".repeat(st.lives) + "☆".repeat(3 - st.lives);
    $("sn-r-list").replaceChildren(...li(st.learned.slice(0, 9)));
    $("sn-r-box").hidden = false; $("sn-r-next").hidden = last;
    $("sn-play").hidden = true; $("sn-result").hidden = false;
  }
  function lose(){
    if ($("sn-play").hidden) return;
    $("sn-r-eyebrow").textContent = lvlName(st.li);
    $("sn-r-title").textContent = t("انتهت المحاولات، جرّب مرة أخرى","Out of tries. Have another go");
    $("sn-r-stars").textContent = "☆☆☆";
    $("sn-r-box").hidden = !st.learned.length;
    $("sn-r-list").replaceChildren(...li(st.learned));
    $("sn-r-next").hidden = true;
    $("sn-play").hidden = true; $("sn-result").hidden = false;
  }
  function size(){
    const w = Math.min(cv.parentElement.clientWidth - 36, 480), dpr = window.devicePixelRatio || 1;
    cv.style.width = w + "px"; cv.style.height = w + "px";
    cv.width = Math.round(w*dpr); cv.height = Math.round(w*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); st.cell = w / N;
  }
  function draw(flash){
    const c = st.cell, W = c*N;
    ctx.fillStyle = flash ? "#3a1616" : "#0e2233"; ctx.fillRect(0,0,W,W);
    ctx.strokeStyle = "rgba(255,255,255,.05)"; ctx.lineWidth = 1;
    for (let i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*c,0); ctx.lineTo(i*c,W); ctx.moveTo(0,i*c); ctx.lineTo(W,i*c); ctx.stroke(); }
    ctx.fillStyle = "#4b6478";
    st.walls.forEach(k => { const [x,y] = k.split(",").map(Number); ctx.fillRect(x*c+1, y*c+1, c-2, c-2); });
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = Math.floor(c*0.72) + "px system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji'";
    st.items.forEach(it => {
      ctx.fillStyle = it.good ? "rgba(240,185,56,.28)" : "rgba(255,255,255,.08)";
      ctx.beginPath(); ctx.arc(it.x*c+c/2, it.y*c+c/2, c*0.48, 0, Math.PI*2); ctx.fill();
      ctx.fillText(ICON[it.a], it.x*c+c/2, it.y*c+c/2+1);
    });
    st.snake.forEach((p, i) => {
      ctx.fillStyle = i === 0 ? "#f0b938" : (i % 2 ? "#3fc28d" : "#33a878");
      ctx.beginPath(); ctx.arc(p.x*c+c/2, p.y*c+c/2, i === 0 ? c*0.46 : c*0.38, 0, Math.PI*2); ctx.fill();
    });
    const h = st.snake[0];
    ctx.fillStyle = "#123a5a"; ctx.beginPath();
    ctx.moveTo(h.x*c+c/2 + st.dir.x*c*0.3, h.y*c+c/2 + st.dir.y*c*0.3);
    ctx.lineTo(h.x*c+c/2 - st.dir.y*c*0.16, h.y*c+c/2 + st.dir.x*c*0.16);
    ctx.lineTo(h.x*c+c/2 + st.dir.y*c*0.16, h.y*c+c/2 - st.dir.x*c*0.16);
    ctx.fill();
  }
  const DIRS = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
  function turn(name){
    if (!st || $("sn-play").hidden) return;
    const d = DIRS[name], last = st.queue.length ? st.queue[st.queue.length-1] : st.dir;
    if ((d.x === -last.x && d.y === -last.y) || (d.x === last.x && d.y === last.y)) return;
    if (st.queue.length < 3) st.queue.push(d);
    if (paused){ paused = false; pauseLabel(); run(); }
  }
  document.querySelectorAll(".pad button").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); turn(b.dataset.d); }));
  document.addEventListener("keydown", e => {
    const k = {ArrowUp:"up", ArrowDown:"down", ArrowLeft:"left", ArrowRight:"right"}[e.key];
    if (k && !$("p-snake").hidden && !$("sn-play").hidden){ e.preventDefault(); turn(k); }
  });
  let t0 = null;
  cv.addEventListener("pointerdown", e => { t0 = {x:e.clientX, y:e.clientY}; });
  cv.addEventListener("pointerup", e => {
    if (!t0) return; const dx = e.clientX - t0.x, dy = e.clientY - t0.y; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
  });
  $("sn-pause").addEventListener("click", () => { if (timer) window.snakePause(); else { paused = false; pauseLabel(); run(); } });
  $("sn-exit").addEventListener("click", () => { stop(); renderMap(); });
  $("sn-r-map").addEventListener("click", renderMap);
  $("sn-r-retry").addEventListener("click", () => start(st.li));
  $("sn-r-next").addEventListener("click", () => start(st.li + 1));
  document.addEventListener("visibilitychange", () => { if (document.hidden) window.snakePause(); });
  window.addEventListener("resize", () => { if (st && !$("sn-play").hidden){ size(); draw(); } });
  pauseLabel(); renderMap();
})();

// ---------- champions: monthly visits board ----------
const champ = (function(){
  const BADGES = [[3,"🥉",t("3 أيام","3 days")],[7,"🥈",t("أسبوع","1 week")],[14,"🥇",t("أسبوعان","2 weeks")],[30,"🏆",t("شهر كامل","1 month")]];
  let me = null, loading = false;
  function rpc(fn, body){
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 10000);
    return fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method:"POST", signal: ctl.signal,
      headers:{ apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY, "Content-Type":"application/json" },
      body: JSON.stringify(body || {})
    }).then(r => r.json().then(j => { clearTimeout(timer); if (!r.ok) throw new Error((j && j.message) || r.status); return j; }));
  }
  function secret(){
    let s = store.get("player_secret", null);
    if (!s){
      const a = new Uint8Array(24);
      try { crypto.getRandomValues(a); } catch(e) { for (let i=0;i<a.length;i++) a[i] = Math.floor(Math.random()*256); }
      s = Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
      store.set("player_secret", s);
    }
    return s;
  }
  function checkin(nickname){
    const id = store.get("player_id", null);
    return rpc("bousla_checkin", { p_id: id, p_secret: secret(), p_nickname: nickname || null })
      .catch(err => {
        if (id && /unknown player/.test(err.message)){ store.set("player_id", null); return rpc("bousla_checkin", { p_id: null, p_secret: secret(), p_nickname: nickname || store.get("nickname", null) }); }
        throw err;
      })
      .then(r => { me = r; store.set("player_id", r.id); if (r.nickname) store.set("nickname", r.nickname); serverStreak = r.streak; renderStreak(); renderMe(); return r; });
  }
  function renderMe(){
    const total = me ? me.total_days : 0;
    $("c-mdays").textContent = me ? me.month_days : "–";
    $("c-streak").textContent = me ? me.streak : "–";
    $("c-rank").textContent = me && me.rank ? "#" + me.rank : "–";
    $("c-badges").replaceChildren(...BADGES.map(([n, ic, lab]) => {
      const b = el("span", "badge" + (total >= n ? "" : " off"), ic + " " + lab);
      b.title = t("مجموع أيام الزيارة: ","Total visit days: ") + n; return b;
    }));
    $("c-status").textContent = me ? (me.nickname ? t("مجموع أيام زيارتك: ","Your total visit days: ") + total : t("اختر اسمًا ليظهر ترتيبك في اللوحة.","Pick a name to appear on the board.")) : "";
  }
  function renderBoard(rows){
    const mine = me && me.nickname;
    $("c-list").replaceChildren(...rows.map(row => {
      const item = el("li", mine && row.nickname === mine ? "me" : "");
      item.append(el("span","r", row.rank === 1 ? "👑" : "#" + row.rank), el("span","nm", row.nickname),
        el("span","num", row.month_days + days(row.month_days)));
      return item;
    }));
    $("c-empty").hidden = rows.length > 0;
  }
  function load(){
    if (loading) return; loading = true;
    $("c-status").textContent = t("جارٍ التحميل…","Loading…");
    (me ? Promise.resolve(me) : checkin())
      .then(() => rpc("bousla_leaderboard"))
      .then(renderBoard)
      .catch(() => { $("c-status").textContent = t("تعذّر الاتصال بلوحة الأبطال الآن. تأكد من الإنترنت ثم اضغط تحديث.","Couldn't reach the champions board. Check your internet, then tap Refresh."); })
      .finally(() => { loading = false; if (me) renderMe(); });
  }
  // month header and prize
  const qatar = new Date(now.toLocaleString("en-US", {timeZone:"Asia/Qatar"}));
  const daysInMonth = new Date(qatar.getFullYear(), qatar.getMonth()+1, 0).getDate();
  const left = daysInMonth - qatar.getDate();
  $("c-month").textContent = qatar.toLocaleDateString(LANG === "en" ? "en-GB" : "ar", {month:"long", year:"numeric"});
  $("c-prize").textContent = PRIZE[LANG];
  $("c-left").textContent = left > 0 ? t("باقٍ على نهاية المسابقة " + left + days(left) + ".", left + days(left) + " left in this month's contest.") : t("اليوم آخر يوم في مسابقة هذا الشهر!","Today is the last day of this month's contest!");
  $("c-nick").value = store.get("nickname", "") || "";
  $("c-form").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("c-nick").value.trim(), note = $("c-nnote");
    if (v.length < 2 || v.length > 20){ note.className = "note bad"; note.textContent = t("الاسم يجب أن يكون من 2 إلى 20 حرفًا.","The name must be 2–20 characters."); return; }
    $("c-save").disabled = true; note.className = "note"; note.textContent = "";
    checkin(v).then(() => rpc("bousla_leaderboard")).then(rows => { renderBoard(rows); note.className = "note good"; note.textContent = t("تم! اسمك الآن في اللوحة.","Done! Your name is on the board."); })
      .catch(() => { note.className = "note bad"; note.textContent = t("لم يُحفظ الاسم. تأكد من الإنترنت وحاول مرة أخرى.","The name wasn't saved. Check your internet and try again."); })
      .finally(() => { $("c-save").disabled = false; });
  });
  $("c-refresh").addEventListener("click", () => { me = null; load(); });
  renderMe();
  // count today's visit quietly on open
  checkin().catch(() => {});
  return { load };
})();
function loadBoard(){ champ.load(); }

renderStreak(); renderDots();
const startTab = (location.hash || "").slice(1); if (TABS.includes(startTab)) show(startTab);
</script>
